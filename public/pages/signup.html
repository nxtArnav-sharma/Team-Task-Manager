<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Create Account</h2>
      <div id="error-msg" class="error-message"></div>
      <form id="signup-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" required minlength="2" maxlength="50">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8">
        <button type="submit" id="submit-btn" class="btn-primary">Create Account</button>
      </form>
      <p style="margin-top: 16px; text-align: center; font-size: 0.9rem;">
        Already have an account? <a href="/login">Log In</a>
      </p>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('signup-form').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error-msg');
      btn.textContent = 'Creating account...';
      btn.disabled = true;
      err.style.display = 'none';

      try {
        await api('POST', '/auth/signup', {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        window.location.href = '/login';
      } catch (e) {
        err.textContent = e.message;
        err.style.display = 'block';
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
