<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme app-page">
  <div class="app-container">
    <aside class="sidebar">
      <h1>TaskFlow</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="/dashboard" class="active">Dashboard</a></li>
        </ul>
      </nav>
      <div class="sidebar-projects">
        <h3>Projects</h3>
        <ul id="sidebar-project-list" class="nav-links"></ul>
      </div>
      <button onclick="showModal('new-project-modal')" class="btn-primary" style="margin-top: auto;">+ New Project</button>
      <button onclick="logout()" class="btn-danger" style="margin-top: 12px;">Logout</button>
    </aside>

    <main class="main-content">
      <header style="margin-bottom: 32px;">
        <h2>Welcome back, <span id="user-name">...</span></h2>
      </header>

      <div class="stats-grid">
        <div class="stat-card">
          <h4>Total Tasks</h4>
          <div id="stat-total" class="value">0</div>
        </div>
        <div class="stat-card">
          <h4>Done</h4>
          <div id="stat-done" class="value" style="color: var(--success);">0</div>
        </div>
        <div class="stat-card">
          <h4>In Progress</h4>
          <div id="stat-progress" class="value" style="color: var(--accent);">0</div>
        </div>
        <div class="stat-card">
          <h4>Overdue</h4>
          <div id="stat-overdue" class="value" style="color: var(--danger);">0</div>
        </div>
      </div>

      <section>
        <h3 style="margin-bottom: 16px;">My Tasks</h3>
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Project</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Due Date</th>
            </tr>
          </thead>
          <tbody id="my-tasks-body"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="new-project-modal" class="modal">
    <div class="modal-content">
      <h2>New Project</h2>
      <form onsubmit="handleCreateProject(event)">
        <label for="new-project-name">Project Name</label>
        <input type="text" id="new-project-name" required>
        <label for="new-project-desc">Description</label>
        <textarea id="new-project-desc" rows="3"></textarea>
        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button type="button" onclick="closeModal('new-project-modal')" style="background: transparent; color: var(--muted);">Cancel</button>
          <button type="submit" class="btn-primary">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    initDashboard();
  </script>
</body>
</html>
